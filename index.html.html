<title>Daily Work Tracker</title>
<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f9ff;--card:#ffffff;--text:#334155;--muted:#8592a6;--line:#e6edf7;--office:#6ea0f5;--home:#f4b062;--personal:#5fcfa3;--accent:var(--office)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 14px}
.date{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.date button{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.date .d{flex:1;text-align:center;font-weight:600}
.date .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tab{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;text-align:center;color:var(--text);font-size:14px}
.tab b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.tab.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 12%,#fff)}
.panel{box-shadow:0 2px 12px rgba(100,130,180,.10);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.add{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.add input[type=text]{flex:1;min-width:140px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px}
.add select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.add button{padding:10px 16px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.task input{width:18px;height:18px;accent-color:var(--accent)}
.task span{flex:1;word-break:break-word}
.task.done span{text-decoration:line-through;color:var(--muted)}
.pri{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pri.High{color:#dc2626;border-color:#dc2626}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px}
.empty{color:var(--muted);text-align:center;padding:20px 0;font-size:14px}
.foot{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}
.foot button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.sum{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
.ptable{margin-bottom:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ph{padding:8px 12px;font-size:13px;font-weight:600;border-left:4px solid var(--muted);background:var(--bg)}
.ph.High{border-left-color:#f28b82;color:#d9534f}.ph.Medium{border-left-color:#f4b062;color:#c9862f}.ph.Low{border-left-color:#5fcfa3;color:#2f9d75}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle;word-break:break-word}
tbody tr:first-child td{border-top:0}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
td select{padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);font-size:12px}
tr.done td:nth-child(2){text-decoration:line-through;color:var(--muted)}
td.empty{padding:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>📋 Daily Work Tracker</h1>
  <div class="date">
    <button id="prev">←</button>
    <div class="d" id="dlabel"></div>
    <button id="today">Today</button>
    <button id="next">→</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="panel">
    <div class="meta"><span id="pcount"></span><span id="ppct"></span></div>
    <div class="bar"><i id="pbar"></i></div>
    <div class="add">
      <input type="text" id="txt" placeholder="Add a task…" maxlength="200">
      <select id="pri"><option>Medium</option><option>High</option><option>Low</option></select>
      <button id="addbtn">Add</button>
    </div>
    <div id="list"></div>
    <div class="foot"><button id="carry">Carry over unfinished from yesterday</button><button id="clear">Clear completed</button></div>
  </div>
  <div class="sum" id="sum"></div>
</div>
<script>
var CATS=[{k:'office',n:'🏢 Office',c:'--office'},{k:'home',n:'🏠 Home',c:'--home'},{k:'personal',n:'🙂 Personal',c:'--personal'}];
var KEY='daily-tracker-v1',tasks=[],cat='office',cur=new Date();
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function ds(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function $(i){return document.getElementById(i)}
function todo(c,d){return tasks.filter(function(t){return t.cat===c&&t.date===d})}
function render(){
  var d=ds(cur),cd=CATS.filter(function(c){return c.k===cat})[0];
  document.documentElement.style.setProperty('--accent','var('+cd.c+')');
  $('dlabel').innerHTML=cur.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'})+(d===ds(new Date())?'<small>Today</small>':'');
  $('tabs').innerHTML='';
  CATS.forEach(function(c){
    var l=todo(c.k,d),dn=l.filter(function(t){return t.done}).length;
    var b=document.createElement('button');b.className='tab'+(c.k===cat?' on':'');
    b.style.setProperty('--accent','var('+c.c+')');
    b.innerHTML=c.n+'<b>'+dn+'/'+l.length+' done</b>';
    b.onclick=function(){cat=c.k;render()};$('tabs').appendChild(b);
  });
  var L=todo(cat,d),D=L.filter(function(t){return t.done}).length,p=L.length?Math.round(D/L.length*100):0;
  $('pcount').textContent=D+' of '+L.length+' completed';$('ppct').textContent=p+'%';$('pbar').style.width=p+'%';
  var el=$('list');el.innerHTML='';
  ['High','Medium','Low'].forEach(function(P){
    var items=L.filter(function(t){return t.pri===P}).sort(function(a,b){return a.done-b.done});
    var box=document.createElement('div');box.className='ptable';
    var h=document.createElement('div');h.className='ph '+P;h.textContent=P+' priority ('+items.length+')';
    box.appendChild(h);
    var wrap=document.createElement('div');wrap.className='tw';
    var tb=document.createElement('table');
    tb.innerHTML='<thead><tr><th style="width:44px">Done</th><th>Task</th><th style="width:100px">Priority</th><th style="width:34px"></th></tr></thead>';
    var body=document.createElement('tbody');
    if(!items.length){var er=document.createElement('tr');er.innerHTML='<td colspan="4" class="empty">No tasks</td>';body.appendChild(er);}
    items.forEach(function(t){
      var r=document.createElement('tr');if(t.done)r.className='done';
      var c1=document.createElement('td'),c2=document.createElement('td'),c3=document.createElement('td'),c4=document.createElement('td');
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;
      cb.onchange=function(){t.done=cb.checked;save();render()};c1.appendChild(cb);
      c2.textContent=t.text;
      var sel=document.createElement('select');
      ['High','Medium','Low'].forEach(function(o){var op=document.createElement('option');op.textContent=o;if(o===t.pri)op.selected=true;sel.appendChild(op)});
      sel.onchange=function(){t.pri=sel.value;save();render()};c3.appendChild(sel);
      var x=document.createElement('button');x.className='x';x.textContent='\u00d7';x.setAttribute('aria-label','Delete');
      x.onclick=function(){tasks=tasks.filter(function(o){return o!==t});save();render()};c4.appendChild(x);
      r.appendChild(c1);r.appendChild(c2);r.appendChild(c3);r.appendChild(c4);body.appendChild(r);
    });
    tb.appendChild(body);wrap.appendChild(tb);box.appendChild(wrap);el.appendChild(box);
  });
  var all=tasks.filter(function(t){return t.date===d}),ad=all.filter(function(t){return t.done}).length;
  $('sum').textContent=all.length?'Overall today: '+ad+' of '+all.length+' tasks done ('+Math.round(ad/all.length*100)+'%)':'';
}
function add(){
  var v=$('txt').value.trim();if(!v)return;
  tasks.push({id:Date.now()+Math.random(),cat:cat,date:ds(cur),text:v,pri:$('pri').value,done:false});
  $('txt').value='';save();render();
}
$('addbtn').onclick=add;
$('txt').addEventListener('keydown',function(e){if(e.key==='Enter')add()});
$('prev').onclick=function(){cur.setDate(cur.getDate()-1);render()};
$('next').onclick=function(){cur.setDate(cur.getDate()+1);render()};
$('today').onclick=function(){cur=new Date();render()};
$('clear').onclick=function(){var d=ds(cur);tasks=tasks.filter(function(t){return !(t.cat===cat&&t.date===d&&t.done)});save();render()};
$('carry').onclick=function(){
  var y=new Date(cur);y.setDate(y.getDate()-1);var d=ds(cur);
  todo(cat,ds(y)).filter(function(t){return !t.done}).forEach(function(t){
    if(!todo(cat,d).some(function(o){return o.text===t.text}))tasks.push({id:Date.now()+Math.random(),cat:cat,date:d,text:t.text,pri:t.pri,done:false});
  });save();render();
};
render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
